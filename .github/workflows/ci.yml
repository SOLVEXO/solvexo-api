name: CI (solvexo-api)
on:
  pull_request:
  push:
    branches-ignore: [main, staging, feature/jamibranch]   # feature/jamibranch is covered by tests.yml (the gate), so it is not run twice
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json # engines.node — the same Node the production build (Railway) uses
          cache: npm
      - run: npm ci
      - run: npm run build
      # production starts `node dist/main` (deploy.yml / staging.yml run `pm2 start dist/main.js`): fail here if the build did not
      # emit that entry (a stray .ts file outside src/ moves the output to dist/src/main.js and a deploy would keep running stale code)
      - run: test -f dist/main.js && test ! -e dist/src/main.js
      - run: npx jest --runInBand
      # Lint is informational only for now, not a required check — this
      # codebase has real, pre-existing lint debt (disclosed separately, not
      # introduced by this workflow — hundreds of pre-existing `any`-typing
      # violations) that a blocking gate would flag as permanently red on
      # every run, which is worse than no gate at all. Also note: `npm run
      # lint` itself runs with `--fix` baked in (see package.json) — never
      # wire that into a blocking CI gate even after the debt is paid down,
      # since it would silently rewrite files rather than just reporting.
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true
